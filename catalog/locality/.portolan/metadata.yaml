# Human-enriched metadata for the locality collection.
#
# Tracked in git, never published: tools/publish.py skips every
# dot-directory. This is the canonical home for the facts below, and
# README.md carries the human-facing rendering. Keep the two in step by
# rerunning tools/make_readmes.py after any edit here.

